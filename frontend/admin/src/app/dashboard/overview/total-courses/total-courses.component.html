<div class="trezo-card bg-white dark:bg-[#0c1427] mb-0 p-[20px] rounded-md">
    <div class="trezo-card-content">
        <div class="flex items-center justify-between mb-[10px]">
            <div class="flex items-center">
                <span class="block">
                    Pending Approvals
                </span>
                <span class="inline-block px-[8.3px] py-[1px] text-warning-700 border border-warning-200 bg-warning-100 dark:bg-[#15203c] dark:border-[#172036] text-sm ltr:ml-[10px] rtl:mr-[10px] rounded-[100px]">
                    {{ pendingPercentage }}%
                </span>
            </div>
            <span class="block text-sm text-gray-500 dark:text-gray-400">
                This week
            </span>
        </div>
        <h5 class="!text-lg md:!text-[20px] !mb-0 mb-[8px]">
            {{ pendingCount }}
        </h5>
        <div class="w-full h-[100px] mb-[15px] overflow-hidden">
            <div id="overview_total_courses_chart" class="w-full h-full"></div>
        </div>
        <ul class="mt-[10px]">
            <li class="text-sm ltr:pl-[30px] rtl:pr-[30px] flex justify-between relative mb-[6px] last:mb-0">
                <span class="inline-block bg-yellow-500 ltr:left-0 rtl:right-0 absolute top-1/2 -translate-y-1/2 w-[20px] h-[5px] rounded-md"></span>
                <span class="block">
                    Pending
                </span>
                <span class="block">
                    {{ pendingPercentage }}%
                </span>
            </li>
            <li class="text-sm ltr:pl-[30px] rtl:pr-[30px] flex justify-between relative mb-[6px] last:mb-0">
                <span class="inline-block bg-green-500 ltr:left-0 rtl:right-0 absolute top-1/2 -translate-y-1/2 w-[20px] h-[5px] rounded-md"></span>
                <span class="block">
                    Approved
                </span>
                <span class="block">
                    {{ approvedPercentage }}%
                </span>
            </li>
            <li class="text-sm ltr:pl-[30px] rtl:pr-[30px] flex justify-between relative mb-[6px] last:mb-0">
                <span class="inline-block bg-red-500 ltr:left-0 rtl:right-0 absolute top-1/2 -translate-y-1/2 w-[20px] h-[5px] rounded-md"></span>
                <span class="block">
                    Rejected
                </span>
                <span class="block">
                    {{ rejectedPercentage }}%
                </span>
            </li>
        </ul>
    </div>
</div>
