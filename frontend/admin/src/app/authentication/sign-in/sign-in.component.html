
<button type="button" class="light-dark-toggle leading-none inline-block transition-all text-orange-400 absolute top-[20px] md:top-[25px] ltr:right-[20px] rtl:left-[20px] ltr:md:right-[25px] rtl:md:left-[25px]" (click)="toggleTheme()">
    <i class="material-symbols-outlined !text-[20px] md:!text-[22px]">
        light_mode
    </i>
</button>

<div class="bg-white dark:bg-[#0a0e19] min-h-screen flex items-center justify-center py-[60px] px-[12.5px]">
    <div class="w-full max-w-[450px]">
        <div class="text-center mb-[30px]">
            <img src="images/logo-white.svg" alt="logo" class="inline-block h-[50px]">
            <h1 class="!font-semibold !text-[24px] md:!text-[28px] !mb-[8px] mt-[20px]">
                Đăng nhập Admin
            </h1>
            <p class="font-medium text-[#445164] dark:text-gray-400">
                Đăng nhập để truy cập bảng điều khiển admin
            </p>
        </div>

        <div class="bg-white dark:bg-[#0c1427] rounded-[15px] border border-gray-200 dark:border-[#172036] p-[30px] shadow-lg">
            <form (ngSubmit)="onSubmit()">
                @if (errorMessage) {
                    <div class="mb-[20px] p-[15px] bg-danger-50 dark:bg-danger-900/20 border border-danger-200 dark:border-danger-700 rounded-md">
                        <p class="text-danger-600 dark:text-danger-400 text-sm font-medium flex items-center gap-[8px]">
                            <i class="material-symbols-outlined !text-[20px]">error</i>
                            {{ errorMessage }}
                        </p>
                    </div>
                }

                <div class="mb-[20px]">
                    <label class="mb-[10px] text-black dark:text-white font-medium block">
                        Email
                    </label>
                    <input
                        type="email"
                        [(ngModel)]="email"
                        name="email"
                        [disabled]="isLoading"
                        class="h-[50px] rounded-md text-black dark:text-white border border-gray-200 dark:border-[#172036] bg-white dark:bg-[#0c1427] px-[17px] block w-full outline-0 transition-all placeholder:text-gray-500 dark:placeholder:text-gray-400 focus:border-primary-500 disabled:opacity-50 disabled:cursor-not-allowed"
                        placeholder="admin@vidu.com"
                        required>
                </div>

                <div class="mb-[25px] relative">
                    <label class="mb-[10px] text-black dark:text-white font-medium block">
                        Mật khẩu
                    </label>
                    <input
                        [type]="isPasswordVisible ? 'text' : 'password'"
                        [(ngModel)]="password"
                        name="password"
                        [disabled]="isLoading"
                        class="h-[50px] rounded-md text-black dark:text-white border border-gray-200 dark:border-[#172036] bg-white dark:bg-[#0c1427] px-[17px] block w-full outline-0 transition-all placeholder:text-gray-500 dark:placeholder:text-gray-400 focus:border-primary-500 disabled:opacity-50 disabled:cursor-not-allowed pr-[50px]"
                        placeholder="Nhập mật khẩu của bạn"
                        required>
                    <button
                        class="absolute text-lg ltr:right-[20px] rtl:left-[20px] bottom-[12px] transition-all hover:text-primary-500"
                        (click)="togglePasswordVisibility()"
                        type="button"
                        [disabled]="isLoading">
                        <i [class]="isPasswordVisible ? 'ri-eye-line' : 'ri-eye-off-line'"></i>
                    </button>
                </div>

                <button
                    type="submit"
                    [disabled]="isLoading"
                    class="md:text-md block w-full text-center transition-all rounded-md font-medium py-[14px] px-[25px] text-white bg-primary-500 hover:bg-primary-600 disabled:opacity-50 disabled:cursor-not-allowed">
                    <span class="flex items-center justify-center gap-[8px]">
                        @if (isLoading) {
                            <i class="material-symbols-outlined animate-spin">refresh</i>
                            Đang đăng nhập...
                        } @else {
                            <i class="material-symbols-outlined">login</i>
                            Đăng nhập
                        }
                    </span>
                </button>
            </form>
        </div>

        <p class="text-center mt-[20px] text-sm text-gray-500 dark:text-gray-400">
             2026 Admin Dashboard. All rights reserved.
        </p>
    </div>
</div>
