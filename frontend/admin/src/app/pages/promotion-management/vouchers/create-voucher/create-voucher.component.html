
<div class="mb-[25px] md:flex items-center justify-between">
    <h5 class="!mb-0">
        Create Voucher
    </h5>
    <ol class="breadcrumb mt-[12px] md:mt-0">
        <li class="breadcrumb-item inline-block relative text-sm mx-[13px] ltr:first:ml-0 rtl:first:mr-0 ltr:last:mr-0 rtl:last:ml-0">
            <a routerLink="/dashboard" class="inline-block relative ltr:pl-[22px] rtl:pr-[22px] transition-all hover:text-primary-500">
                <i class="material-symbols-outlined absolute ltr:left-0 rtl:right-0 !text-lg -mt-px text-primary-500 top-1/2 -translate-y-1/2">home</i>
                Dashboard
            </a>
        </li>
        <li class="breadcrumb-item inline-block relative text-sm mx-[13px] ltr:first:ml-0 rtl:first:mr-0 ltr:last:mr-0 rtl:last:ml-0">
            <a routerLink="/dashboard/promotion/vouchers" class="transition-all hover:text-primary-500">Promotion Management</a>
        </li>
        <li class="breadcrumb-item inline-block relative text-sm mx-[13px] ltr:first:ml-0 rtl:first:mr-0 ltr:last:mr-0 rtl:last:ml-0">
            Create Voucher
        </li>
    </ol>
</div>

<div class="trezo-card bg-white dark:bg-[#0c1427] p-[20px] md:p-[25px] rounded-md">
    <form [formGroup]="voucherForm" (ngSubmit)="saveVoucher()">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-[15px] mb-[15px]">

            <div>
                <label class="block text-sm font-medium text-black dark:text-white mb-[8px]">
                    Voucher Code <span class="text-danger-500">*</span>
                </label>
                <div class="flex gap-[10px]">
                    <input
                        type="text"
                        formControlName="code"
                        placeholder="BLACKFRIDAY"
                        class="flex-1 px-[12px] py-[8px] border border-gray-200 rounded-md text-black dark:text-white dark:bg-[#15203c] dark:border-[#172036]">
                    <button type="button" (click)="generateRandomCode()" class="px-[16px] py-[8px] bg-primary-50 text-primary-600 rounded-md hover:bg-primary-100 dark:bg-[#15203c] dark:hover:bg-[#1a2a4a]">
                        Generate Random
                    </button>
                </div>
            </div>

            <div>
                <label class="block text-sm font-medium text-black dark:text-white mb-[8px]">
                    Description (Internal Note)
                </label>
                <input
                    type="text"
                    formControlName="description"
                    placeholder="Code for 11/11 campaign"
                    class="w-full px-[12px] py-[8px] border border-gray-200 rounded-md text-black dark:text-white dark:bg-[#15203c] dark:border-[#172036]">
            </div>
        </div>

        <div class="mb-[15px]">
            <label class="block text-sm font-medium text-black dark:text-white mb-[12px]">
                Discount Type <span class="text-danger-500">*</span>
            </label>
            <div class="flex gap-[20px]">
                <label class="flex items-center cursor-pointer">
                    <input
                        type="radio"
                        formControlName="discountType"
                        value="percentage"
                        class="mr-[8px]">
                    <span class="text-black dark:text-white">Percentage (%)</span>
                    <input type="number" formControlName="discountValue" placeholder="30" class="ml-[8px] w-[80px] px-[8px] py-[4px] border border-gray-200 rounded-md text-black dark:text-white dark:bg-[#15203c] dark:border-[#172036]">
                    <span class="ml-[4px]">%</span>
                </label>
                <label class="flex items-center cursor-pointer">
                    <input
                        type="radio"
                        formControlName="discountType"
                        value="fixed"
                        class="mr-[8px]">
                    <span class="text-black dark:text-white">Fixed Amount</span>
                    <input type="number" formControlName="discountValue" placeholder="100000" class="ml-[8px] w-[120px] px-[8px] py-[4px] border border-gray-200 rounded-md text-black dark:text-white dark:bg-[#15203c] dark:border-[#172036]">
                    <span class="ml-[4px]">VNĐ</span>
                </label>
            </div>
        </div>

        @if (voucherForm.get('discountType')?.value === 'percentage') {
            <div class="mb-[15px]">
                <label class="block text-sm font-medium text-black dark:text-white mb-[8px]">
                    Maximum Discount (VNĐ)
                </label>
                <input
                    type="number"
                    formControlName="maxDiscount"
                    placeholder="200000"
                    class="w-[200px] px-[12px] py-[8px] border border-gray-200 rounded-md text-black dark:text-white dark:bg-[#15203c] dark:border-[#172036]">
                <p class="text-xs text-gray-500 mt-[4px]">Leave blank if unlimited</p>
            </div>
        }

        <div class="mb-[15px]">
            <label class="block text-sm font-medium text-black dark:text-white mb-[12px]">
                Product Type <span class="text-danger-500">*</span>
            </label>
            <div class="flex gap-[20px]">
                <label class="flex items-center cursor-pointer">
                    <input type="radio" formControlName="productType" value="course" class="mr-[8px]">
                    <span class="text-black dark:text-white">Courses Only</span>
                </label>
                <label class="flex items-center cursor-pointer">
                    <input type="radio" formControlName="productType" value="class" class="mr-[8px]">
                    <span class="text-black dark:text-white">1-on-1 Classes Only</span>
                </label>
                <label class="flex items-center cursor-pointer">
                    <input type="radio" formControlName="productType" value="group" class="mr-[8px]">
                    <span class="text-black dark:text-white">Group Classes</span>
                </label>
                <label class="flex items-center cursor-pointer">
                    <input type="radio" formControlName="productType" value="both" class="mr-[8px]">
                    <span class="text-black dark:text-white">Both (All Products)</span>
                </label>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-[12px] mb-[15px]">
            <div>
                <label class="block text-sm font-medium text-black dark:text-white mb-[8px]">
                    Minimum Order Value (VNĐ)
                </label>
                <input
                    type="number"
                    formControlName="minOrderValue"
                    placeholder="500000"
                    min="1"
                    class="w-full px-[12px] py-[8px] border border-gray-200 rounded-md text-black dark:text-white dark:bg-[#15203c] dark:border-[#172036]">
            </div>
            <div>
                <label class="block text-sm font-medium text-black dark:text-white mb-[8px]">
                    Total Usage Limit
                </label>
                <input
                    type="number"
                    formControlName="totalUsageLimit"
                    placeholder="500"
                    min="1"
                    class="w-full px-[12px] py-[8px] border border-gray-200 rounded-md text-black dark:text-white dark:bg-[#15203c] dark:border-[#172036]">
            </div>
            <div>
                <label class="block text-sm font-medium text-black dark:text-white mb-[8px]">
                    Usage per Student
                </label>
                <input
                    type="number"
                    formControlName="usagePerUser"
                    placeholder="1"
                    min="1"
                    class="w-full px-[12px] py-[8px] border border-gray-200 rounded-md text-black dark:text-white dark:bg-[#15203c] dark:border-[#172036]">
            </div>
        </div>

        <div class="flex flex-col md:flex-row gap-[12px] mb-[15px]">
            <div>
                <label class="block text-sm font-medium text-black dark:text-white mb-[8px]">
                    Start Date <span class="text-danger-500">*</span>
                </label>
                <input
                    type="datetime-local"
                    formControlName="startDate"
                    class="w-[200px] px-[12px] py-[8px] border border-gray-200 rounded-md text-black dark:text-white dark:bg-[#15203c] dark:border-[#172036]">
            </div>
            <div>
                <label class="block text-sm font-medium text-black dark:text-white mb-[8px]">
                    End Date <span class="text-danger-500">*</span>
                </label>
                <input
                    type="datetime-local"
                    formControlName="endDate"
                    class="w-[200px] px-[12px] py-[8px] border border-gray-200 rounded-md text-black dark:text-white dark:bg-[#15203c] dark:border-[#172036]">
            </div>
        </div>

        <div class="mb-[15px]">
            <label class="flex items-center cursor-pointer">
                <input type="checkbox" formControlName="isUnlimited" class="mr-[8px]">
                <span class="text-black dark:text-white text-sm">Set as unlimited</span>
            </label>
        </div>

        <div *ngIf="message" class="mb-[15px] p-[12px] rounded-md" [ngClass]="{
            'bg-green-100 text-green-800 dark:bg-green-900 dark:text-green-200': message.type === 'success',
            'bg-red-100 text-red-800 dark:bg-red-900 dark:text-red-200': message.type === 'error'
        }">
            {{ message.text }}
        </div>

        <div class="flex gap-[12px]">
            <button type="submit" [disabled]="isLoading" class="px-[24px] py-[10px] bg-primary-500 text-white rounded-md hover:bg-primary-600 disabled:opacity-50 disabled:cursor-not-allowed">
                <span *ngIf="isLoading" class="inline-block mr-2">
                    <i class="material-symbols-outlined animate-spin text-sm">refresh</i>
                </span>
                {{ isLoading ? 'Saving...' : 'Save Voucher' }}
            </button>
            <button type="button" routerLink="/dashboard/promotion/vouchers" class="px-[24px] py-[10px] bg-gray-200 text-black rounded-md hover:bg-gray-300 dark:bg-[#15203c] dark:text-white dark:hover:bg-[#1a2a4a]">
                Cancel
            </button>
        </div>
    </form>
</div>
