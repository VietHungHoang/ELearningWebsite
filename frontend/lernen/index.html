<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>lernen</title>
      <style>
          @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap');
          html {
              /* Increase base font size for better readability across the app */
              font-size: 106.25%; /* 17px on a 16px base */
          }
          body {
              font-family: 'Roboto', sans-serif;
              background-color: #F8F7F4;
              background-image: radial-gradient(circle at top left, hsl(38, 33%, 95%), #F8F7F4 50%);
          }

          button {
              cursor: pointer;
          }

          .custom-scrollbar {
              scrollbar-width: thin;
              scrollbar-color: #d1d5db transparent;
          }

          .custom-scrollbar::-webkit-scrollbar {
              width: 6px;
          }

          .custom-scrollbar::-webkit-scrollbar-track {
              background: transparent;
          }

          .custom-scrollbar::-webkit-scrollbar-thumb {
              background-color: #d1d5db;
              border-radius: 10px;
          }

          .scrollbar-hide::-webkit-scrollbar {
              display: none;
          }
          .scrollbar-hide {
              -ms-overflow-style: none;
              scrollbar-width: none;
          }
          .range-input {
              -webkit-appearance: none;
              -moz-appearance: none;
              appearance: none;
              position: absolute;
              width: 100%;
              height: 4px;
              background: transparent;
              pointer-events: none;
              margin-top: 4px;
          }
          .range-input::-webkit-slider-thumb {
              -webkit-appearance: none;
              appearance: none;
              height: 16px;
              width: 16px;
              background-color: #0b6459;
              border-radius: 50%;
              border: 2px solid white;
              box-shadow: 0 0 0 1px rgba(0,0,0,0.1);
              cursor: pointer;
              pointer-events: auto;
              margin-top: -6px;
          }
          .range-input::-moz-range-thumb {
              height: 14px;
              width: 14px;
              background-color: #0b6459;
              border-radius: 50%;
              border: 2px solid white;
              box-shadow: 0 0 0 1px rgba(0,0,0,0.1);
              cursor: pointer;
              pointer-events: auto;
          }

          /* == GLOBAL ANIMATIONS & TRANSITIONS == */
          @keyframes fadeInUp {
              from { transform: translateY(20px); opacity: 0; }
              to { transform: translateY(0); opacity: 1; }
          }
          @keyframes float {
              0%, 100% { transform: translateY(0px); }
              50% { transform: translateY(-8px); }
          }
          @keyframes spin-slow {
              from { transform: rotate(0deg); }
              to { transform: rotate(360deg); }
          }
          @keyframes modal-in {
              from { transform: translateY(20px) scale(0.98); opacity: 0; }
              to { transform: translateY(0) scale(1); opacity: 1; }
          }
          @keyframes dropdown-in {
              from {
                  opacity: 0;
                  transform: translateY(-10px) scale(0.95);
              }
              to {
                  opacity: 1;
                  transform: translateY(0) scale(1);
              }
          }

          /* Animation Utilities */
          .animate-fade-in-up {
              animation: fadeInUp 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
              opacity: 0;
          }
          .animate-float {
              animation: float 4s ease-in-out infinite;
          }
          .animate-spin-slow {
              animation: spin-slow 20s linear infinite;
          }
          .animate-modal-in {
              animation: modal-in 0.3s ease-out forwards;
          }
          .animate-dropdown-in {
              animation: dropdown-in 0.2s ease-out forwards;
              transform-origin: top right;
          }

          /* Card Hover Effect */
          .interactive-card {
              transition: transform 0.3s ease-out, box-shadow 0.3s ease-out;
          }
          .interactive-card:hover {
              transform: translateY(-6px);
              box-shadow: 0 10px 25px -3px rgba(11, 100, 89, 0.1), 0 4px 6px -4px rgba(11, 100, 89, 0.1);
          }

          /* Image Zoom on Group Hover */
          .group:hover .zoom-image {
              transform: scale(1.05);
          }
          .zoom-image {
              transition: transform 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
          }

          /* General Button Hover Effect */
          .btn-scale {
              transition: transform 0.2s cubic-bezier(0.25, 0.46, 0.45, 0.94), background-color 0.2s ease-out, box-shadow 0.2s ease-out;
          }
          .btn-scale:hover {
              transform: translateY(-2px);
              box-shadow: 0 4px 12px rgba(11, 100, 89, 0.2);
          }
          .btn-scale:active {
              transform: translateY(-1px) scale(0.98);
              box-shadow: 0 2px 6px rgba(11, 100, 89, 0.15);
          }
      </style>
      </head>
  <body class="bg-[#F8F7F4]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
