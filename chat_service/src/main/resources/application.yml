spring:
  application:
    name: chat-service
  profiles:
    active: dev # đổi thành 'prod' khi deploy thật
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000
      jedis:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

server:
  port: 8084

eureka:
  client:
    enabled: true
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true
    hostname: chat-service

logging:
  level:
    root: INFO
    org.springframework.web: DEBUG
    "[org.springframework.messaging]": DEBUG

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
