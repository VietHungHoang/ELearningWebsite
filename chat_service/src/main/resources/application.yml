spring:
  application:
    name: chat-service
  profiles:
    active: dev # đổi thành 'prod' khi deploy thật
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000
      jedis:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

server:
  port: 8084

logging:
  level:
    root: INFO
    org.springframework.web: DEBUG
    "[org.springframework.messaging]": DEBUG
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
