spring:
  application:
    name: learner-bff-service

  # Redis config (for caching)
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000

server:
  port: 8083

# Downstream services base URLs
services:
  learner-service:
    url: http://localhost:8082/api/v1
  course-service:
    url: http://localhost:8084/api/v1
  user-service:
    url: http://localhost:8081/api/v1
  quiz-service:
    url: http://localhost:8085/api/v1

# Logging
logging:
  level:
    com.elearning: DEBUG

# Swagger
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /api-docs
