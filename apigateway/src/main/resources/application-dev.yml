server:
  port: 3000

spring:
  main:
    web-application-type: servlet

services:
  auth-service:
    url: http://localhost:8082
  learner-service:
    url: http://localhost:8083
  course-service:
    url: http://localhost:8084
  notification-service:
    url: http://localhost:8085

# Định nghĩa logging trong local
logging:
  level:
    root: INFO
    "[com.elearning.apigateway]": DEBUG
eureka:
  client:
    enabled: false # ✅ Tắt hoàn toàn Eureka Client
    register-with-eureka: false
    fetch-registry: false
