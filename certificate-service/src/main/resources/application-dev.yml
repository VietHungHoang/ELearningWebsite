spring:
  datasource:
    url: jdbc:mysql://localhost:3306/certificate_service_db
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      "[hibernate.format_sql]": false
    database-platform: org.hibernate.dialect.MySQL8Dialect

# URL của content-service trong môi trường local
content:
  service:
    url: http://localhost:8081/api/files/upload
