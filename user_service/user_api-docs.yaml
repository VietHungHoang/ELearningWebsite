openapi: 3.0.1
info:
  title: OpenAPI definition
  version: v0
servers:
- url: http://localhost:8081
  description: Generated server url
paths:
  /api/v1/profiles/{accountId}:
    get:
      tags:
      - profile-controller
      operationId: getProfileByAccountId
      parameters:
      - name: accountId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseProfileResponse"
    put:
      tags:
      - profile-controller
      operationId: createOrUpdateProfile
      parameters:
      - name: accountId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseProfileResponse"
  /api/v1/accounts/{id}/deactivate:
    put:
      tags:
      - account-controller
      operationId: deactivateAccount
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseVoid"
  /api/v1/accounts/{id}/activate:
    put:
      tags:
      - account-controller
      operationId: activateAccount
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseVoid"
  /api/v1/accounts/internal:
    post:
      tags:
      - account-controller
      operationId: createAccount
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountCreateRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseAccountResponse"
  /api/v1/accounts:
    get:
      tags:
      - account-controller
      operationId: getAccounts
      parameters:
      - name: email
        in: query
        required: false
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponse"
  /api/v1/accounts/{id}:
    get:
      tags:
      - account-controller
      operationId: getAccountById
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseAccountResponse"
components:
  schemas:
    ProfileRequest:
      type: object
      properties:
        fullName:
          type: string
        phone:
          type: string
        avatarUrl:
          type: string
        bio:
          type: string
    ApiResponseProfileResponse:
      type: object
      properties:
        success:
          type: integer
          format: int32
        message:
          type: string
        data:
          $ref: "#/components/schemas/ProfileResponse"
    ProfileResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        accountId:
          type: integer
          format: int64
        fullName:
          type: string
        phone:
          type: string
        avatarUrl:
          type: string
        bio:
          type: string
    ApiResponseVoid:
      type: object
      properties:
        success:
          type: integer
          format: int32
        message:
          type: string
        data:
          type: object
    AccountCreateRequest:
      type: object
      properties:
        email:
          type: string
        role:
          type: string
          enum:
          - ADMIN
          - INSTRUCTOR
          - LEARNER
        profile:
          $ref: "#/components/schemas/ProfileRequest"
    AccountResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        email:
          type: string
        role:
          type: string
          enum:
          - ADMIN
          - INSTRUCTOR
          - LEARNER
    ApiResponseAccountResponse:
      type: object
      properties:
        success:
          type: integer
          format: int32
        message:
          type: string
        data:
          $ref: "#/components/schemas/AccountResponse"
    ApiResponse:
      type: object
      properties:
        success:
          type: integer
          format: int32
        message:
          type: string
        data:
          type: object
