spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:elearning_common_prod}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  data:
    redis:
      url: localhost:6379
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    defer-datasource-initialization: true

services:
  auth-service:
    url: http://localhost:8085
  cart-service:
    url: http://localhost:8082
  notification-service:
    url: http://localhost:8083
  course-service:
    url: http://localhost:8081
  common-service:
    url: http://localhost:8084
  tutor-service:
    url: http://localhost:8086
# Định nghĩa logging trong local
logging:
  level:
    root: INFO
    "[com.elearning.apigateway]": DEBUG

# Zoom OAuth Configuration
zoom:
  oauth:
    client-id: ${ZOOM_CLIENT_ID:your-client-id}
    client-secret: ${ZOOM_CLIENT_SECRET:your-client-secret}
    redirect-uri: ${ZOOM_REDIRECT_URI:http://localhost:8087/api/v1/zoom/oauth/callback}
    authorize-url: https://zoom.us/oauth/authorize
    token-url: https://zoom.us/oauth/token
  api:
    base-url: https://api.zoom.us/v2
  meeting:
    default-duration: 60
    waiting-room: false

# Kafka Configuration
spring.kafka:
  bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
  producer:
    key-serializer: org.apache.kafka.common.serialization.StringSerializer
    value-serializer: org.apache.kafka.common.serialization.StringSerializer
