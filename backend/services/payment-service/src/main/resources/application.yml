server:
  port: 8086

spring:
  application:
    name: payment-service
  datasource:
    url: jdbc:postgresql://localhost:5432/payment_service
    username: postgres
    password: root
  jpa:
    hibernate:
      ddl-auto: update
  kafka:
    producer:
      # Địa chỉ của Kafka broker. Phải khớp với port bạn đã map ra từ Docker.
      bootstrap-servers: localhost:29092
      # Lớp serializer cho KEY của message. Key sẽ là String (ví dụ: paymentId).
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      # Lớp serializer cho VALUE của message.
      # JsonSerializer của Spring sẽ tự động chuyển đổi Java Object thành chuỗi JSON.
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        # Cấu hình acks=all là một lựa chọn an toàn cho các nghiệp vụ quan trọng.
        # Producer sẽ đợi cho đến khi cả leader và các follower đều xác nhận đã nhận message.
        # Bảo serializer dùng alias thay vì tên class đầy đủ
        acks: "all"
        spring.json.add.type.headers: false

# Configuration for external payment providers. Add provider-specific keys here.
payment:
  providers:
    momo:
      partnerCode: "MOMOI0ZT20251005_TEST"
      accessKey: "RAlqforIHMzHupmt"
      # secretKey and endpoint are optional but commonly needed for real integrations
      secretKey: "UeTsSYek1420zZmXpbinGDnTviPnditj"
      endpoint: "https://test-payment.momo.vn/v2/gateway/api"