version: '3.8'

services:
  payment-service:
    container_name: payment-service-app
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
    image: payment-service-dev
    ports:
      - "8086:8086"
    environment:
      - DATABASE_URL=jdbc:postgresql://db:5432/payments_db
      - DATABASE_USERNAME=payment_user
      - DATABASE_PASSWORD=payment_pass
    depends_on:
      - db
    volumes:
      - ./src/main:/app/src/main
      - ./pom.xml:/app/pom.xml
    command: mvn spring-boot:run -Dspring-boot.run.fork=false

  db:
    image: postgres:15-alpine
    container_name: payment-db
    environment:
      - POSTGRES_DB=payments_db
      - POSTGRES_USER=payment_user
      - POSTGRES_PASSWORD=payment_pass
    ports:
      - "5434:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data: