spring:
  datasource:
    url: ${COMMON_DB_URL}
    username: ${COMMON_DB_USERNAME}
    password: ${COMMON_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true