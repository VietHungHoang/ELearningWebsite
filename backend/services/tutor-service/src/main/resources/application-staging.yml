spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

gemini:
  api-key: AIzaSyDRUFCJA2ZtNYRjOniJdAnGhgUTOa1uHcI
  api-url: https://generativelanguage.googleapis.com/v1beta/models/gemini-pro:generateContent

services:
  auth-service:
    url: ${AUTH_SERVICE_URL}
  cart-service:
    url: http://cart-service:8082
  notification-service:
    url: ${NOTIFICATION_SERVICE_URL}
  course-service:
    url: ${COURSE_SERVICE_URL}
  common-service:
    url: ${COMMON_SERVICE_URL}
  tutor-service:
    url: ${TUTOR_SERVICE_URL}

logging:
  level:
    root: INFO
    "[com.elearning.bffservice]": DEBUG