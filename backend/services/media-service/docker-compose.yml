  db:
    image: postgres:15-alpine
    container_name: media-db
    environment:
      - POSTGRES_DB=media_service_db
      - POSTGRES_USER=media_user
      - POSTGRES_PASSWORD=media_pass
    ports:
      - "5435:5432"  # Different port from course-service (5433)
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U media_user -d media_service_db"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres-data: