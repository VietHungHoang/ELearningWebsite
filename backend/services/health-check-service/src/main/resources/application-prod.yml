# Health check configuration
health-check:
  enabled: true
  interval: 600000 # 10 minutes
  timeout: 5000    # 5 seconds

# Service URLs for health checking
services:
  auth-service:
    url: https://lernen-auth-service.onrender.com

  notification-service:
    url: https://lernen-notification-service.onrender.com

  common-service:
    url: https://lernen-common-service.onrender.com

  tutor-service:
    url: https://lernen-tutor-service.onrender.com

  class-service:
    url: https://lernen-class-service.onrender.com

  student-service:
    url: https://lernen-student-service.onrender.com

  search-service:
    url: https://lernen-search-service.onrender.com

  chat-service:
    url: https://lernen-chat-service.onrender.com

  booking-service:
    url: https://lernen-booking-service.onrender.com

  payment-service:
    url: https://lernen-payment-service.onrender.com

  quiz-service:
    url: https://lernen-quiz-service.onrender.com

  file-service:
    url: https://lernen-file-service.onrender.com

  bff-service:
    url: https://lernen-bff-service.onrender.com

logging:
  level:
    root: INFO
    com.elearning.healthcheckservice: DEBUG
