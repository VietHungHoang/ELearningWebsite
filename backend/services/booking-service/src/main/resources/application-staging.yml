spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

services:
  class-service:
    url: ${CLASS_SERVICE_URL:http://localhost:8088}
  payment-service:
    url: ${PAYMENT_SERVICE_URL:http://localhost:8091}

logging:
  level:
    root: INFO
    "[com.elearning.bookingservice]": DEBUG