spring:
  application:
    name: file-service
  profiles:
    active: dev

  # File Upload Configuration
  servlet:
    multipart:
      max-file-size: 2GB
      max-request-size: 2GB
      enabled: true
      location: ${java.io.tmpdir}
      resolve-lazily: true

# Server Configuration
server:
  port: ${SERVER_PORT:8083}
  servlet:
    context-path: /
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json

# AWS S3 Configuration
aws:
  s3:
    bucket-name: ${AWS_S3_BUCKET_NAME:lernen}
    region: ${AWS_S3_REGION:ap-southeast-2}
    base-url: ${AWS_S3_BASE_URL:https://lernen.s3.ap-southeast-2.amazonaws.com/}
    folders:
      images: lernen/images
      videos: lernen/videos
      documents: lernen/documents

# Media Type Configurations
media:
  image:
    max-size-in-bytes: ${IMAGE_MAX_FILE_SIZE:10485760}
    allowed-types:
      - image/jpeg
      - image/jpg
      - image/png
      - image/webp
      - image/gif

  video:
    max-size-in-bytes: ${VIDEO_MAX_FILE_SIZE:524288000}
    allowed-types:
      - video/mp4
      - video/quicktime
      - video/x-msvideo
      - video/webm
      - video/x-ms-wmv

  document:
    max-size-in-bytes: ${DOCUMENT_MAX_FILE_SIZE:52428800}
    allowed-types:
      - application/pdf
      - application/vnd.openxmlformats-officedocument.wordprocessingml.document
      - application/msword
      - application/vnd.openxmlformats-officedocument.presentationml.presentation
      - application/vnd.ms-powerpoint
      - application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
      - application/vnd.ms-excel
      - text/plain

# Logging Configuration
logging:
  level:
    com.elearning.fileservice: DEBUG
    org.springframework.web: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

# Management and Monitoring
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized