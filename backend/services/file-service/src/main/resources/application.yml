spring:
  application:
    name: file-service
  profiles:
    active: dev

  # Database Configuration
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5435/file_service_db}
    username: ${DATABASE_USERNAME:file_user}
    password: ${DATABASE_PASSWORD:file_pass}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
      leak-detection-threshold: 60000
  
  # JPA Configuration
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
        order_inserts: true
        order_updates: true
        jdbc:
          batch_size: 20
    show-sql: false
    open-in-view: false
  
  # File Upload Configuration
  servlet:
    multipart:
      max-file-size: 2GB
      max-request-size: 2GB
      enabled: true
      location: ${java.io.tmpdir}
      resolve-lazily: true

# Kafka Configuration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
      batch-size: 16384
      linger-ms: 1
      buffer-memory: 33554432
    consumer:
      group-id: media-service-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: true
      auto-commit-interval-ms: 1000
      properties:
        spring.json.trusted.packages: "*"

# Server Configuration
server:
  port: ${SERVER_PORT:8083}
  servlet:
    context-path: /
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json

# AWS S3 Configuration for Strategy Pattern
aws:
  s3:
    buckets:
      IMAGE:
        bucket-name: ${AWS_S3_IMAGES_BUCKET_NAME:my-elearning-course-images}
        region: ${AWS_S3_REGION:ap-southeast-2}
        baseUrl: ${AWS_S3_IMAGES_BASE_URL:https://my-elearning-course-images.s3.ap-southeast-2.amazonaws.com/}
      VIDEO:
        bucket-name: ${AWS_S3_VIDEOS_BUCKET_NAME:my-elearning-course-videos}
        region: ${AWS_S3_REGION:ap-southeast-2}
        baseUrl: ${AWS_S3_VIDEOS_BASE_URL:https://my-elearning-course-videos.s3.ap-southeast-2.amazonaws.com/}
      DOCUMENT:
        bucket-name: ${AWS_S3_DOCUMENTS_BUCKET_NAME:my-elearning-documents}
        region: ${AWS_S3_REGION:ap-southeast-2}
        baseUrl: ${AWS_S3_DOCUMENTS_BASE_URL:https://my-elearning-documents.s3.ap-southeast-2.amazonaws.com/}

# Kafka Topics Configuration
kafka:
  topics:
    video-transcoding: video-transcoding

# Media Type Configurations for Strategy Pattern
media:
  image:
    max-size-in-bytes: ${IMAGE_MAX_FILE_SIZE:10485760}  # 10MB
    allowed-types:
      - image/jpeg
      - image/jpg
      - image/png
      - image/webp
      - image/gif
    allowed-extensions:
      - .jpg
      - .jpeg
      - .png
      - .webp
      - .gif

  video:
    max-size-in-bytes: ${VIDEO_MAX_FILE_SIZE:524288000}  # 500MB
    allowed-types:
      - video/mp4
      - video/quicktime
      - video/x-msvideo
      - video/webm
      - video/x-ms-wmv
    allowed-extensions:
      - .mp4
      - .mov
      - .avi
      - .webm
      - .wmv

  document:
    max-size-in-bytes: ${DOCUMENT_MAX_FILE_SIZE:52428800}  # 50MB
    allowed-types:
      - application/pdf
      - application/vnd.openxmlformats-officedocument.wordprocessingml.document
      - application/msword
      - application/vnd.openxmlformats-officedocument.presentationml.presentation
      - application/vnd.ms-powerpoint
      - application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
      - application/vnd.ms-excel
      - text/plain
    allowed-extensions:
      - .pdf
      - .docx
      - .doc
      - .pptx
      - .ppt
      - .xlsx
      - .xls
      - .txt

# Logging Configuration
logging:
  level:
    com.elearning.contentservice: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# Management and Monitoring
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
  health:
    db:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true

# Application Info
info:
  app:
    name: ${spring.application.name}
    description: E-Learning Content Management Service
    version: 1.0.0
    encoding: UTF-8
    java:
      version: ${java.version}