version: '3.8'

services:
  course-service:
    container_name: course-service-app
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
    image: course-service-dev
    ports:
      - "8081:8081"
    environment:
      - DATABASE_URL=jdbc:postgresql://db:5432/courses_db
      - DATABASE_USERNAME=course_user
      - DATABASE_PASSWORD=course_pass
    depends_on:
      - db
    volumes:
      - ./src/main:/app/src/main
      - ./pom.xml:/app/pom.xml
    command: mvn spring-boot:run -Dspring-boot.run.fork=false

  db:
    image: postgres:15-alpine
    container_name: course-db
    environment:
      - POSTGRES_DB=courses_db
      - POSTGRES_USER=course_user
      - POSTGRES_PASSWORD=course_pass
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
