server:
  port: 8085

spring:
  application:
    name: transcoding-service

# FFmpeg Configuration
ffmpeg:
  binary-path: ffmpeg  # Path to FFmpeg binary
  output-formats:
    - resolution: 1080p
      bitrate: 5000k
      audio-bitrate: 192k
    - resolution: 720p
      bitrate: 3000k
      audio-bitrate: 128k
    - resolution: 480p
      bitrate: 1500k
      audio-bitrate: 96k
  hls:
    segment-duration: 10  # seconds
    playlist-type: vod

# Processing Configuration
processing:
  workspace-root: /tmp/transcoding
  cleanup-after-processing: true
  cleanup-on-failure: false  # Keep files when processing fails for debugging
  max-concurrent-jobs: 2

logging:
  level:
    com.elearning.transcodingservice: DEBUG

# Kafka configuration placeholders (no listeners implemented yet)
kafka:
  bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
  topics:
    video-transcoding: video-transcoding
    video-processed: video-processed
  properties:
    sasl.mechanism: PLAIN
    security.protocol: SASL_SSL
    sasl.jaas.config: >
      org.apache.kafka.common.security.plain.PlainLoginModule required
      username="${KAFKA_API_KEY}"
      password="${KAFKA_API_SECRET}";

aws:
  s3:
    buckets:
      VIDEO-RAW:
        bucket-name: ${AWS_S3_VIDEOS_RAW_BUCKET_NAME}
        region: ${AWS_S3_REGION}
      VIDEO-STREAM:
        bucket-name: ${AWS_S3_VIDEOS_STREAM_BUCKET_NAME}
        region: ${AWS_S3_REGION}