spring:
  application:
    name: content-service
  
  # Database Configuration
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5434/content_service_db}
    username: ${DATABASE_USERNAME:content_user}
    password: ${DATABASE_PASSWORD:content_pass}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
      leak-detection-threshold: 60000
  
  # JPA Configuration
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        use_sql_comments: true
        order_inserts: true
        order_updates: true
        jdbc:
          batch_size: 20
    show-sql: false
    open-in-view: false
  
  # File Upload Configuration
  servlet:
    multipart:
      max-file-size: 2GB
      max-request-size: 2GB
      enabled: true
      location: ${java.io.tmpdir}
      resolve-lazily: true

# Server Configuration
server:
  port: ${SERVER_PORT:8082}
  servlet:
    context-path: /
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json

# AWS S3 Configuration
aws:
  s3:
    images:
      bucket-name: ${AWS_S3_BUCKET_NAME:my-elearning-course-videos}
      region: ${AWS_S3_REGION:ap-southeast-2}
    videos:
      bucket-name: ${AWS_S3_BUCKET_NAME:my-elearning-course-videos}
      region: ${AWS_S3_REGION:ap-southeast-2}

# Image Upload Configuration
image:
  max-size-in-bytes: ${IMAGE_MAX_FILE_SIZE:10485760}  # 10MB
  allowed-types:
    - image/jpeg
    - image/jpg
    - image/png
    - image/webp
    - image/gif
  allowed-extensions:
    - .jpg
    - .jpeg
    - .png
    - .webp
    - .gif

# Video Upload Configuration
video:
  max-file-size: ${VIDEO_MAX_FILE_SIZE:2147483648}  # 2GB
  allowed-formats:
    - mp4
    - mov
    - avi
    - mkv
    - webm
  upload-chunk-size: 10485760  # 10MB

# Logging Configuration
logging:
  level:
    com.elearning.contentservice: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# Management and Monitoring
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
  health:
    db:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true

# Application Info
info:
  app:
    name: ${spring.application.name}
    description: E-Learning Content Management Service
    version: 1.0.0
    encoding: UTF-8
    java:
      version: ${java.version}