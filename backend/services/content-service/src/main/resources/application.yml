server:
    port: 8082

spring:
    application:
        name: content-service
    profiles:
        active: dev

    datasource:
        url: jdbc:postgresql://localhost:5434/content_service_db
        username: content_user
        password: content_pass
        driver-class-name: org.postgresql.Driver

    jpa:
        hibernate:
            ddl-auto: update
        show-sql: true
        properties:
            hibernate:
                jdbc:
                    time_zone: Asia/Ho_Chi_Minh
                format_sql: true
                use_sql_comments: true

    kafka:
        consumer:
            # Địa chỉ của Kafka broker.
            bootstrap-servers: localhost:29092
            # ID duy nhất cho consumer group này. Rất quan trọng!
            # Tất cả các instance của ContentService sẽ dùng chung ID này.
            group-id: "content-service-group"
            # Khi một consumer group mới được tạo, nó sẽ bắt đầu đọc từ đâu.
            # 'earliest': đọc lại từ đầu lịch sử của topic.
            # 'latest': chỉ đọc các message mới được gửi đến sau khi nó khởi động.
            auto-offset-reset: "earliest"
            # Lớp deserializer cho KEY. Phải khớp với serializer của producer.
            key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
            # Lớp deserializer cho VALUE.
            value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
            properties:
                # Quan trọng: Cho phép JsonDeserializer biết class Java nào để map JSON tới.
                # Nếu không có, nó sẽ báo lỗi class not found.
                # Cho phép Deserializer sử dụng class từ listener
                spring.json.use.type.headers: false
        # Chỉ định class mặc định để deserialize thành
                spring.json.value.default.type: com.elearning.contentservice.events.CourseCreatedEvent # <--- THÊM DÒNG NÀY
                # spring.json.trusted.packages: "com.elearning.contentservice.events"
                spring.json.trusted.packages: "*"
            
        # properties:
            # Thêm cấu hình Type Mapping
            # spring.json.value.type.mapping: "courseCreatedEventAlias:com.elearning.contentservice.events.CourseCreatedEvent"
                # Bật/tắt chế độ tự động commit offset. Chúng ta sẽ để Spring quản lý.
                # enable.auto.commit: "true" # Mặc định là true, không cần ghi
                # auto.commit.interval.ms: "5000" # Mặc định 5s commit 1 lần

        # Cấu hình riêng cho listener (nếu cần)
        # listener:
        #   ack-mode: record # Sẽ giải thích sau

    sql:
        init:
            mode: always
            platform: postgresql

management:
    endpoints:
        web:
            exposure:
                include: health,info,metrics
    endpoint:
        health:
            show-details: when_authorized

logging:
    level:
        com.elearning.contentservice: DEBUG
        org.hibernate.SQL: DEBUG
        org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    pattern:
        console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

# Custom application properties
app:
    name: "Content Service"
    description: "Service for managing course curriculum and learning content"
    version: "1.0.0"
