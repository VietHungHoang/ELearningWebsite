spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080
  cloud:
    gateway:
      routes:
        - id: bff-route
          uri: http://localhost:8083
          predicates:
            - Path=/api/v1/web/**
            - Path=/api/v1/public/**
            - Path=/api/v1/tutors/**
          filters:
            - RewritePath=/api/v1/(web|public|tutors)/(.*), /api/v1/bff/$2

        - id: auth-service-route
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/auth/**

services:
  quiz-service:
    url: http://localhost:8093