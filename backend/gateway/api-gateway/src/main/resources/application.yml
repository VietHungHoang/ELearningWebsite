spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: course-service-route
          uri: lb://course-service
          predicates:
            - Path=/api/courses/**

        - id: user-service-route
          uri: lb://user-service
          predicates:
            - Path=/api/users/**

server:
  port: 8000

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
