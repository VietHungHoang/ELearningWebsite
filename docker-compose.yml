version: '3.8'

services:
  # Whisper Transcription REST API
  whisper-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: whisper-transcription-api
    ports:
      - "5000:5000"
    environment:
      - FLASK_APP=src/api/app.py
      - FLASK_ENV=${FLASK_ENV:-production}
      - FLASK_DEBUG=${FLASK_DEBUG:-False}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - LESSON_SERVICE_URL=${LESSON_SERVICE_URL:-http://lesson-service:8000/api}
      - WHISPER_HOME=/app/models
    volumes:
      - ./audio:/app/audio                    # Input audio files
      - ./output:/app/output                  # Output SRT/VTT files
      - ./models:/app/models                  # Whisper model cache (persistent)
      - ./src:/app/src                        # Source code (dev hot-reload)
    networks:
      - whisper-network
    command: python -m flask run --host=0.0.0.0
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '1'
          memory: 2G
    profiles:
      - ""  # Default - always active

  # Optional: Lesson Service (if running locally)
  lesson-service:
    image: ${LESSON_SERVICE_IMAGE:-placeholder}
    container_name: lesson-service
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=${LESSON_SERVICE_DB_URL}
    networks:
      - whisper-network
    restart: unless-stopped
    profiles:
      - lesson-service  # Only with: docker-compose --profile lesson-service up

networks:
  whisper-network:
    driver: bridge

volumes:
  models:
    driver: local


