services:
  db:
    image: postgres:15
    container_name: lernen-db
    environment:
      POSTGRES_DB: lernen
      POSTGRES_USER: lernen
      POSTGRES_PASSWORD: lernen
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:8-alpine
    container_name: lernen-redis
    ports:
      - "6379:6379"

  mongodb:
    image: mongo:latest
    container_name: chat-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  keycloak:
    image: quay.io/keycloak/keycloak:26.4.4
    container_name: keycloak
    command: ["start-dev"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://3.25.255.238/lernen_db
      KC_DB_USERNAME: lernen
      KC_DB_PASSWORD: lernen
      KC_DB_SCHEMA: keycloak
    ports:
      - "8080:8080"
    env_file:
      - .env
    depends_on:
      - db

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.2.0
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms1g -Xmx1g"
    ports:
      - "9200:9200"
    volumes:
      - esdata:/usr/share/elasticsearch/data

  kibana:
    image: docker.elastic.co/kibana/kibana:9.2.0
    container_name: kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch

  zookeeper:
    image: confluentinc/cp-zookeeper:latest
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
  
  kafka:
    image: confluentinc/cp-kafka:7.3.0
    container_name: kafka
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      kAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    ports:
      - "9092:9092"
    depends_on:
      - zookeeper
    
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    ports:
      - "11273:8080"

  api-gateway:
    build:
      context: ./backend/gateway/api-gateway
      dockerfile: docker/Dockerfile.dev
    container_name: api-gateway
    ports:
      - "8081:8081"
    environment:
      - SPRING_PROFILES_ACTIVE=staging
    env_file:
      - .env
    volumes:
      - ./backend/gateway/api-gateway/src:/app/src
      - ./backend/gateway/api-gateway/pom.xml:/app/pom.xml
    depends_on:
      - bff-service
      - auth-service
      - common-service

  auth-service:
    build:
      context: ./backend/services/auth-service
      dockerfile: docker/Dockerfile.dev
    container_name: auth-service
    ports:
      - "8082:8082"
    environment:
      - SPRING_PROFILES_ACTIVE=staging
    env_file:
      - .env
    volumes:
      - ./backend/services/auth-service/src:/app/src
      - ./backend/services/auth-service/pom.xml:/app/pom.xml
    depends_on:
      - redis
      - keycloak
      - kafka

  bff-service:
    build:
      context: ./backend/services/bff-service
      dockerfile: docker/Dockerfile.dev
    container_name: bff-service
    ports:
      - "8083:8083"
    environment:
      - SPRING_PROFILES_ACTIVE=staging
    env_file:
      - .env
    volumes:
      - ./backend/services/bff-service/src:/app/src
      - ./backend/services/bff-service/pom.xml:/app/pom.xml
    depends_on:
      - common-service

  common-service:
