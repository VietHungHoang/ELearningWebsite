services:
  # Whisper Transcription REST API
  # Usage: docker-compose up
  # API will serve pre-generated SRT/VTT files from ./output/
  whisper-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: whisper-transcription-api
    ports:
      - "5000:5000"
    environment:
      - FLASK_APP=src/api/app.py
      - FLASK_ENV=${FLASK_ENV:-production}
      - FLASK_DEBUG=${FLASK_DEBUG:-False}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - LESSON_SERVICE_URL=${LESSON_SERVICE_URL:-http://localhost:8000/api}
      - WHISPER_HOME=/app/models
    volumes:
      - ./output:/app/output                  # Output SRT/VTT files (read-only for API)
      - ./models:/app/models                  # Whisper model cache (persistent)
    networks:
      - whisper-network
    command: python -m flask run --host=0.0.0.0
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '1'
          memory: 2G

networks:
  whisper-network:
    driver: bridge

volumes:
  models:
    driver: local


