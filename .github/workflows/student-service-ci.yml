name: Student Service CI

on:
  push:
    branches: ["main"]
    paths:
      - 'backend/services/student-service/**'
      - '.github/workflows/student-service-ci.yml'

jobs:
  build-and-push-student-service:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push Student Service
        uses: docker/build-push-action@v5
        with:
          context: ./backend/services/student-service
          file: ./backend/services/student-service/docker/Dockerfile.prod
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/lernen-student-service:latest
          
      - name: Trigger OnRender Deploy for Student Service
        run: curl -X POST ${{ secrets.ONRENDER_HOOK_STUDENT_SERVICE }}