name: Booking Service CI

on:
  push:
    branches: ["main"]
    paths:
      - 'backend/services/booking-service/**'
      - '.github/workflows/booking-service-ci.yml'

jobs:
  build-and-push-booking-service:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push Booking Service
        uses: docker/build-push-action@v5
        with:
          context: ./backend/services/booking-service
          file: ./backend/services/booking-service/docker/Dockerfile.prod
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/lernen-booking-service:latest
          
      - name: Trigger OnRender Deploy for Booking Service
        run: curl -X POST ${{ secrets.ONRENDER_HOOK_BOOKING_SERVICE }}
