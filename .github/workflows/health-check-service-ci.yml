name: Health Check Service CI

on:
  push:
    branches: ["main"]
    paths:
      - 'backend/services/health-check-service/**'
      - '.github/workflows/health-check-service-ci.yml'

jobs:
  build-and-push-health-check-service:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push Health Check Service
        uses: docker/build-push-action@v5
        with:
          context: ./backend/services/health-check-service
          file: ./backend/services/health-check-service/docker/Dockerfile.prod
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/lernen-health-check-service:latest

      - name: Trigger OnRender Deploy for Health Check Service
        run: curl -X POST ${{ secrets.ONRENDER_HOOK_HEALTH_CHECK_SERVICE }}