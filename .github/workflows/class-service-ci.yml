name: Class Service CI

on:
  push:
    branches: ["main"]
    paths:
      - 'backend/services/class-service/**'
      - '.github/workflows/class-service-ci.yml'

jobs:
  build-and-push-class-service:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push Class Service
        uses: docker/build-push-action@v5
        with:
          context: ./backend/services/class-service
          file: ./backend/services/class-service/docker/Dockerfile.prod
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/lernen-class-service:latest

      - name: Trigger OnRender Deploy for Class Service
        run: curl -X POST ${{ secrets.ONRENDER_HOOK_CLASS_SERVICE }}