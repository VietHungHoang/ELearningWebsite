name: Payment Service CI

on:
  push:
    branches: ["main"]
    paths:
      - 'backend/services/payment-service/**'
      - '.github/workflows/payment-service-ci.yml'

jobs:
  build-and-push-payment-service:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push Payment Service
        uses: docker/build-push-action@v5
        with:
          context: ./backend/services/payment-service
          file: ./backend/services/payment-service/docker/Dockerfile.prod
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/lernen-payment-service:latest

      - name: Trigger OnRender Deploy for Payment Service
        run: curl -X POST ${{ secrets.ONRENDER_HOOK_PAYMENT_SERVICE }}
        