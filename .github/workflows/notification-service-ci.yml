name: Notification Service CI

on:
  push:
    branches: ["main"]
    paths:
      - 'backend/services/notification-service/**'
      - '.github/workflows/notification-service-ci.yml'
jobs:
  build-and-push-notification-service:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push Notification Service
        uses: docker/build-push-action@v5
        with:
          context: ./backend/services/notification-service
          file: ./backend/services/notification-service/docker/Dockerfile.prod
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/lernen-notification-service:latest

      - name: Trigger OnRender Deploy for Notification Service
        run: curl -X POST ${{ secrets.ONRENDER_HOOK_NOTIFICATION_SERVICE }}
