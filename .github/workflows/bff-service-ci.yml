name: API Gateway CI

on:
  push:
    branches: ["main"]
    paths:
      - 'backend/services/bff-service/**'
      - '.github/workflows/bff-service-ci.yml'

jobs:
  build-and-push-api-gateway:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push Bff Service
        uses: docker/build-push-action@v5
        with:
          context: ./backend/services/bff-service
          file: ./backend/services/bff-service/docker/Dockerfile.prod
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/lernen-bff-service:latest
          
      - name: Trigger OnRender Deploy for Bff Service
        run: curl -X POST ${{ secrets.ONRENDER_HOOK_BFF_SERVICE }}