name: Search Service CI

on:
  push:
    branches: ["main"]
    paths:
      - 'backend/services/search-service/**'
      - '.github/workflows/search-service-ci.yml'

jobs:
  build-and-push-search-service:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push Search Service
        uses: docker/build-push-action@v5
        with:
          context: ./backend/services/search-service
          file: ./backend/services/search-service/docker/Dockerfile.prod
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/lernen-search-service:latest

      - name: Trigger OnRender Deploy for Search Service
        run: curl -X POST ${{ secrets.ONRENDER_HOOK_SEARCH_SERVICE }}