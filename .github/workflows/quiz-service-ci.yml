name: Quiz Service CI

on:
  push:
    branches: ["main"]
    paths:
      - 'backend/services/quiz-service/**'
      - '.github/workflows/quiz-service-ci.yml'

jobs:
  build-and-push-quiz-service:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push Quiz Service
        uses: docker/build-push-action@v5
        with:
          context: ./backend/services/quiz-service
          file: ./backend/services/quiz-service/docker/Dockerfile.prod
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/lernen-quiz-service:latest

      - name: Trigger OnRender Deploy for Quiz Service
        run: curl -X POST ${{ secrets.ONRENDER_HOOK_QUIZ_SERVICE }}