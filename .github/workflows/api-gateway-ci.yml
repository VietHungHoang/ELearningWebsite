name: API Gateway CI

on:
  push:
    branches: ["main"]
    paths:
      - 'backend/gateway/api-gateway/**'
      - '.github/workflows/api-gateway-ci.yml'

jobs:
  build-and-push-api-gateway:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push API Gateway
        uses: docker/build-push-action@v5
        with:
          context: ./backend/gateway/api-gateway
          file: ./backend/gateway/api-gateway/docker/Dockerfile.prod
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/lernen-api-gateway-aws:latest

      - name: Setup SSH Key
        run: |
          echo "${{ secrets.EC2_SSH_KEY }}" > private_key.pem
          chmod 600 private_key.pem

      - name: Deploy to AWS EC2
        run: |
          ssh -o StrictHostKeyChecking=no -i private_key.pem ubuntu@${{ secrets.AWS_API_GATEWAY }} << 'EOF'
            # Login to Docker Hub
            docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_TOKEN }}
            
            # Pull latest image
            docker pull ${{ secrets.DOCKER_USERNAME }}/lernen-api-gateway-aws
            
            # Stop and remove existing container if exists
            docker stop lernen-api-gateway || true
            docker rm lernen-api-gateway || true
            
            # Run new container
            docker run -d \
              --name lernen-api-gateway \
              --restart unless-stopped \
              -p 8081:8081 \
              -e AUTH_SERVICE_URL=https://lernen-auth-service.onrender.com \
              -e BFF_SERVICE_URL=https://lernen-bff-service.onrender.com \
              -e BOOKING_SERVICE_URL=https://lernen-booking-service.onrender.com \
              -e CHAT_SERVICE_URL=https://lernen-chat-service.onrender.com \
              -e CLASS_SERVICE_URL=https://lernen-class-service.onrender.com \
              -e COMMON_SERVICE_URL=https://lernen-common-service.onrender.com \
              -e FILE_SERVICE_URL=https://lernen-file-service.onrender.com \
              -e KEYCLOAK_ISSUER_URI=https://ec2-3-25-139-45.ap-southeast-2.compute.amazonaws.com:8443/realms/lernen \
              -e NOTIFICATION_SERVICE_URL=https://lernen-notification-service.onrender.com \
              -e PAYMENT_SERVICE_URL=https://lernen-payment-service.onrender.com \
              -e QUIZ_SERVICE_URL=https://lernen-quiz-service.onrender.com \
              -e SEARCH_SERVICE_URL=https://lernen-search-service.onrender.com \
              -e SPRING_PROFILES_ACTIVE=prod \
              -e STUDENT_SERVICE_URL=https://lernen-student-service.onrender.com \
              -e TUTOR_SERVICE_URL=https://lernen-tutor-service.onrender.com \
              ${{ secrets.DOCKER_USERNAME }}/lernen-api-gateway-aws
            
            # Cleanup old images
            docker image prune -f
          EOF

      - name: Cleanup SSH Key
        if: always()
        run: rm -f private_key.pem