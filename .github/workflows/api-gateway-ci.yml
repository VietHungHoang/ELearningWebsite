name: API Gateway CI

on:
  push:
    branches: ["main"]
    paths:
      - 'backend/gateway/api-gateway/**'
      - '.github/workflows/api-gateway-ci.yml'

jobs:
  build-and-push-api-gateway:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push API Gateway
        uses: docker/build-push-action@v5
        with:
          context: ./backend/gateway/api-gateway
          file: ./backend/gateway/api-gateway/docker/Dockerfile.prod
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/lernen-api-gateway:latest
          
      - name: Trigger OnRender Deploy for API Gateway
        run: curl -X POST ${{ secrets.ONRENDER_HOOK_API_GATEWAY }}