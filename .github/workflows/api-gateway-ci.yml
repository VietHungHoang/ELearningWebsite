name: API Gateway CI

on:
  push:
    branches: ["main"]
    paths:
      - 'backend/gateway/api-gateway/**'
      - '.github/workflows/api-gateway-ci.yml'

jobs:
  build-and-push-api-gateway:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push API Gateway
        uses: docker/build-push-action@v5
        with:
          context: ./backend/gateway/api-gateway
          file: ./backend/gateway/api-gateway/docker/Dockerfile.prod
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/lernen-api-gateway-aws:latest

      - name: Setup SSH Key
        run: |
          echo "${{ secrets.EC2_SSH_KEY }}" > private_key.pem
          chmod 600 private_key.pem

      - name: Deploy to AWS EC2
        run: |
          ssh -o StrictHostKeyChecking=no -i private_key.pem ubuntu@${{ secrets.AWS_API_GATEWAY }} << 'EOF'
            # Login to Docker Hub
            docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_TOKEN }}
            
            # Pull latest image
            docker pull ${{ secrets.DOCKER_USERNAME }}/lernen-api-gateway-aws
            
            # Stop and remove existing container if exists
            docker stop lernen-api-gateway || true
            docker rm lernen-api-gateway || true
            
            # Run new container
            docker run -d \
              --name lernen-api-gateway \
              --restart unless-stopped \
              -p 8081:8081 \
              ${{ secrets.DOCKER_USERNAME }}/lernen-api-gateway-aws
            
            # Cleanup old images
            docker image prune -f
          EOF

      - name: Cleanup SSH Key
        if: always()
        run: rm -f private_key.pem