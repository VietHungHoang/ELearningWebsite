spring:
  application:
    name: learner-service
  datasource:
    url: jdbc:mysql://localhost:3306/learner_service_db
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

server:
  port: 8082

eureka:
  client:
    enabled: false

logging:
  level:
    com.elearning: DEBUG

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /api-docs
